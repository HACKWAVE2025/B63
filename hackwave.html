<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voice Stress Detector (Beginner Prototype)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      padding: 40px;
    }
    h1 {
      color: #333;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
    }
    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }
    #resultBox {
      margin-top: 30px;
      font-size: 20px;
      font-weight: bold;
      color: #333;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>🎤 Voice Stress Detector (Basic Frontend Demo)</h1>
  <p>Click "Start" and speak for a few seconds. Then click "Stop" to see the result.</p>

  <button id="startBtn">Start Recording</button>
  <button id="stopBtn" disabled>Stop Recording</button>

  <div id="resultBox">Result will appear here...</div>

  <script>
    let audioContext;
    let microphone;
    let analyser;
    let dataArray;
    let interval;
    let volumeValues = [];

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resultBox = document.getElementById("resultBox");

    startBtn.onclick = async function () {
      // Ask for microphone access
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      // Create audio context and analyser
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      microphone = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;

      // Connect mic -> analyser
      microphone.connect(analyser);

      // Data array to store sound samples
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      volumeValues = [];
      startBtn.disabled = true;
      stopBtn.disabled = false;
      resultBox.innerText = "Listening... 🎧";

      // Measure loudness every 100ms
      interval = setInterval(() => {
        analyser.getByteTimeDomainData(dataArray);

        // Compute average volume
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += Math.abs(dataArray[i] - 128);
        }
        let averageVolume = sum / dataArray.length;
        volumeValues.push(averageVolume);
      }, 100);
    };

    stopBtn.onclick = function () {
      clearInterval(interval);
      stopBtn.disabled = true;
      startBtn.disabled = false;

      // Compute average loudness
      let avg = volumeValues.reduce((a, b) => a + b, 0) / volumeValues.length;

      // Simple logic for stress detection
      let message = "";
      if (avg > 12) {
        message = "😟 You seem stressed. Try taking a deep breath.";
      } else if (avg > 6) {
        message = "🙂 You seem a little nervous, but mostly calm.";
      } else {
        message = "😊 You seem relaxed and calm!";
      }

      resultBox.innerText = `Average Volume: ${avg.toFixed(2)}\n${message}`;
    };
  </script>
</body>
</html>
